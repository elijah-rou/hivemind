[package]
name = "hivemind-worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fuzz"
path = "src/bin/fuzz.rs"

[features]
containerd-integration = []

[dependencies]
chacha20poly1305 = "0.10"
hkdf = "0.12"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.10"
